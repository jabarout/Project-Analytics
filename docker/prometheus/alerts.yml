# Project Analytics — pilot alert rules (M9)
# Thresholds are pilot defaults; override via Prometheus config or re-render for stage/prod.
groups:
  - name: project-analytics-platform
    rules:
      - alert: BackendDown
        expr: up{job="project-analytics-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Project Analytics backend scrape is down"
          description: "Prometheus cannot scrape the backend for more than 2 minutes. See runbook RB-001."
          runbook: "docs/ops/runbooks/RB-001-backend-down.md"

      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5..",job="project-analytics-backend"}[5m]))
            /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="project-analytics-backend"}[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated HTTP 5xx rate on Project Analytics API"
          description: "More than 5% of requests are 5xx over 5 minutes. See runbook RB-001."
          runbook: "docs/ops/runbooks/RB-001-backend-down.md"

      - alert: SyncFailuresElevated
        expr: increase(pa_sync_runs_total{status="failure"}[15m]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Multiple OpenProject synchronization failures"
          description: "More than 2 sync failures in 15 minutes. See runbook RB-002."
          runbook: "docs/ops/runbooks/RB-002-sync-failure.md"

      # Configurable window: default 24h (86400s). Align with SYNC_SUCCESS_STALE_SECONDS.
      - alert: NoSuccessfulSynchronization
        expr: pa_sync_last_success_age_seconds > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No successful synchronization within the configured window"
          description: "Last successful sync is older than 86400 seconds (24h). See runbook RB-002."
          runbook: "docs/ops/runbooks/RB-002-sync-failure.md"
