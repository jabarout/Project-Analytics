# Project Analytics — Prometheus scrape config (M9)
# Scrape the backend Actuator Prometheus endpoint only (local infrastructure metrics).
# Never scrapes OpenProject.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: project-analytics-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: project-analytics-backend
          environment: local
