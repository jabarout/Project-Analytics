<div class="shell">
  <header class="shell__header">
    <div class="shell__brand">
      <app-brand-logo size="md" />
      <div class="shell__brand-text">
        <p class="shell__eyebrow">Decision Intelligence</p>
        <h1 class="shell__title">{{ applicationName }}</h1>
      </div>
    </div>
    <div class="shell__user">
      @if (currentUser(); as user) {
        <span class="shell__username">{{ user.username }} · {{ user.role }}</span>
      }
      <button type="button" class="pa-btn pa-btn--secondary pa-btn--sm" (click)="logout()">
        Sign out
      </button>
    </div>
  </header>

  <div class="shell__body">
    <nav class="shell__nav" aria-label="Primary">
      <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        Home
      </a>
      <a routerLink="/explorer" routerLinkActive="is-active">Explorer</a>
      <a routerLink="/portfolios" routerLinkActive="is-active">Portfolios</a>
      <a routerLink="/reports" routerLinkActive="is-active">Reports</a>
      <a routerLink="/workspaces" routerLinkActive="is-active">Connections</a>
      <a routerLink="/settings" routerLinkActive="is-active">Settings</a>
      <span class="shell__nav-hint">
        Management intelligence on local analytics — OpenProject is sync source only.
      </span>
    </nav>

    <main class="shell__content pa-page-enter">
      <router-outlet />
    </main>
  </div>

  <app-footer />
</div>
