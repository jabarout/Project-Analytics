<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Project Analytics</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Project Analytics — Decision Intelligence Platform for OpenProject"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Dark-first FOUC guard: apply stored/default theme before Angular boots -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pa.theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
