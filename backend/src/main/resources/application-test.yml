# Test profile: in-memory database, Redis disabled, Flyway enabled.
spring:
  datasource:
    url: jdbc:h2:mem:projectanalytics;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

projectanalytics:
  redis:
    enabled: false
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: test-jwt-secret-key-with-32-bytes-min
    expiration-seconds: 3600
    refresh-expiration-seconds: 86400
  openproject:
    url: https://openproject.example.test
    api-key: test-api-key
    timeout-seconds: 5
    verify-ssl: true
  sync:
    enabled: false
    interval-ms: 3600000
  reporting:
    storage-path: ./target/test-reports
    retention-days: 7
    purge-enabled: true
    max-size-bytes: 10485760
  analytics:
    snapshot-retention-days: 7
    snapshot-purge-enabled: true

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.projectanalytics: INFO
